<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b3f3b" />
    <title>QuickLoan is offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: #072a28;
        color: #fff;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      .mark {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background: #f4b63f;
        margin: 0 auto 24px;
        display: grid;
        place-items: center;
        color: #072a28;
        font-size: 36px;
        font-weight: 800;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 26px;
      }
      p {
        margin: 0 auto 28px;
        max-width: 320px;
        line-height: 1.5;
        color: #b0dbd2;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        min-height: 48px;
        padding: 0 28px;
        border-radius: 14px;
        background: #f4b63f;
        color: #072a28;
        font-size: 16px;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">₱</div>
      <h1>You are offline</h1>
      <p>
        QuickLoan needs the internet to show your loans safely. Check your
        connection and try again.
      </p>
      <a class="btn" href="/">Try again</a>
    </main>
  </body>
</html>
